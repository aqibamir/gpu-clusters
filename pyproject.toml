[project]
name = "gpu-clusters"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "psutil>=6.0.0",
    # Phase 3 — anonymization
    "spacy>=3.7.0",
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "cryptography>=42.0.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
# Cloud NVIDIA GPU nodes — install vLLM on Linux with CUDA:
#   pip install vllm  (or: uv pip install vllm)
gpu = [
    "vllm>=0.4.0",
]
# Mac Apple Silicon local testing — install llama-cpp-python with Metal:
#   CMAKE_ARGS="-DGGML_METAL=on" uv pip install llama-cpp-python
metal = [
    "llama-cpp-python>=0.2.90",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cmndr", "cgn", "console", "eval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
